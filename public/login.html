<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tela de Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body>

            </div>

            <div class="formulario">
                <div class="mb-3">
                    <label for="formGroupExampleInput" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="formGroupExampleInput"

                <div class="mb-3">
                    <label for="formGroupExampleInput2" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="formGroupExampleInput2" placeholder="......">
                </div>
            </div>

            <div class="botao">
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="button" onclick="window.location.href='tela_inicial.html'">Entrar</button>
                </div>
                
            </div>

            
        </div>
        <img src="../assets/img/trem-png novo.webp" alt=""style="margin-left:auto">

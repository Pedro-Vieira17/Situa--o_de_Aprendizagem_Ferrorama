<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <div class="container vh-100 d-flex align-items-center">
        <div class="class=" p-3 style="max-width: 400px; width: 100%;">


            <div class="titulo">

                <h1 class="text-nowrap">Cadastro de Usuários</h1>


            </div>

            <div class="formulario">
                <div class="mb-1">
                    <label for="formGroupExampleInput" class="form-label">Nome Completo:</label>
                    <input type="text" class="form-control" id="formGroupExampleInput">
                </div>
                <div class="mb-1">
                    <label for="formGroupExampleInput2" class="form-label">CPF:</label>
                    <input type="number" class="form-control" id="formGroupExampleInput2">
                </div>
                <div class="mb-1">
                    <label for="formGroupExampleInput2" class="form-label">Telefone:</label>
                    <input type="number" class="form-control" id="formGroupExampleInput2">
                </div>
                <div class="mb-1">
                    <label for="formGroupExampleInput2" class="form-label">E-mail:</label>
                    <input type="email" class="form-control" id="formGroupExampleInput2">
                </div>
                <div class="mb-3">
                    <label for="formGroupExampleInput2" class="form-label">Senha:</label>
                    <input type="password" class="form-control" id="formGroupExampleInput2">
                </div>
            </div>

            <div class="botao">
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="button">Cadastrar!</button>
                </div>
                 <a href="tela_incial.html" class="signup-link">Voltar para a tela de início.</a>
            </div>
        </div>
       <img src="../assets/img/trem.png" alt="" width="800px">
    </div>
</body>

</html>
